services:
  db:
    image: postgres:18
    container_name: ModularOutbox-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - 5432:5432
    volumes:
      - ModularOutbox_db_data:/var/lib/postgresql
    networks:
      - ModularOutbox-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ModularOutbox-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: pgadmin@test.co
      PGADMIN_DEFAULT_PASSWORD: pgadmin
    ports:
      - 5050:80
    volumes:
      - ModularOutbox_pgadmin_data:/var/lib/pgadmin
    networks:
      - ModularOutbox-net

volumes:
  ModularOutbox_db_data:
    name: ModularOutbox_db_data
  ModularOutbox_pgadmin_data:
    name: ModularOutbox_pgadmin_data

networks:
  ModularOutbox-net:
    driver: bridge
    name: ModularOutbox-net
